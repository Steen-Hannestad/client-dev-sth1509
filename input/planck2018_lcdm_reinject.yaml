# LambdaCDM against real Planck 2018, WITH CONTINUOUS REINJECTION and the theta_s box
# fixed. 27 dimensions: 6 cosmological + 21 nuisance.
#
# DIFFERENCES FROM planck2018_lcdm.yaml -- there are two, and both matter:
#
# 1. acquisition.n_inject: 100. The quadratic response surface is re-fitted on the WHOLE
#    accumulated training set after every acquisition and 100 fresh points are drawn from
#    the Gaussian it implies, at the acquisition temperature. This costs 100 true
#    evaluations PER ITERATION (2100 rather than 2000), about 5% on the budget, so a
#    comparison against the first run is NOT evaluation-matched and should say so.
#
#    On the 58D Euclid target this was the difference between an arm that never improved
#    (best logL -29,033 against a true maximum of +343.9, 844x the noise floor) and one
#    that reached 91x. On THIS target the first run showed no sign of needing it -- the
#    ESS floor annealed itself off after one iteration and the design started only ~43
#    log-units from the peak -- so the honest expectation here is a null or a modest
#    speed-up, not a rescue. It is being run because it is cheap to find out.
#
# 2. The 100*theta_s prior box is re-centred, in the .param file rather than here.
#    The first run (20260917_102225_planck_lcdm) was truncated hard against the top of
#    that box: both the 68% and 95% upper limits came out exactly 1.04200, the boundary.
#    Cause: the .param centre of 1.04110 is a theta_MC-like number, while CLASS samples
#    the exact acoustic scale theta_s. Measured with CLASS at the Planck 2018 best fit
#    (H0=67.66): 100*theta_s = 1.041888 -- 2.6 sigma above the old centre. The centre is
#    now 1.04189, so the +/-3 sigma box is [1.04099, 1.04279] with the truth at dead
#    centre instead of 0.0001 from the ceiling.
#
#    THE FIRST RUN'S theta_s CONSTRAINT IS NOT USABLE and cannot be repaired by
#    re-sampling: the emulator was TRAINED over the truncated box and has never seen
#    theta_s > 1.04200.
#
# WHAT THE FIRST RUN ESTABLISHED, for comparison. At iteration 5 the emulator posterior
# matched Planck 2018 (TT,TE,EE+lowE+lensing+BAO) to 0.1-0.2 sigma on the five
# unaffected cosmological parameters, reproducing the published error bars to within a
# few percent. Drift: 0.652, 0.145, 0.116, 0.131, 0.110 -- a 6x fall then a plateau.
#
# RUNNING IT. Four ranks, not eight, to leave the machine usable:
#
#   bash
#   source env_planck.sh
#   mpirun -n 4 python client.py input/planck2018_lcdm_reinject.yaml -n planck_reinject -i 16
#
# Expect ~2 evaluations/s on 4 ranks against ~2.9 on 8, so roughly 30 min per iteration
# and 8 h for the full 16 -- PROVIDED Low Power Mode is off. Check `pmset -g live`: the
# AC profile on this machine has lowpowermode 1, which halves throughput. See CHANGES.md
# section 8 for why the MPI workers no longer spin while rank 0 trains.

likelihood:
  wrapper: montepython
  input: input/montepython/base2018TTTEEE_lensing_bao.param

prior:
  n_samples: 2000
  sampling_strategy: lhs
  n_sigma: 3.0
  n_inject: 100          # injection starts AT ITERATION 0, right after the LHS design
  #
  # NOTE ON THE ESS FLOOR, recorded because CHANGES.md section 2 measured it. The floor
  # over-corrects when n_inject <= alpha*n_samples/(1-alpha), which at alpha=0.1 and
  # n_samples=2000 is 222. 100 is BELOW that threshold: the 100 injected points sit near
  # the peak and dominate the weights, giving ESS ~ 100 against the floor's target of
  # 0.1*2100 = 210, so c is forced up until it drags the distant LHS points back in --
  # landing near the anchor error rather than at c0. On the 29D banana that was c = 4611
  # (1.14 x A) at n_inject 100, against 98.7 (0.02 x A) at n_inject 250.
  #
  # RUN DELIBERATELY AT 100 ANYWAY, at the user's instruction, 17 Sep 2026. Expect
  # iteration 0's `[msre] ESS floor` line to report a large c inflation -- that is this
  # interaction, not a fault. Later iterations are unaffected: by then the training set
  # is large and filled, and acquisition.n_inject's 100 points are a small perturbation
  # on it rather than the only thing near the peak.

acquisition:
  n_append: 2000
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0
  batch_size: 10
  n_inject: 100          # THE VARIABLE UNDER TEST: re-fit and re-draw every iteration

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250
  lr_schedule: none
  warm_start: true

sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 216
  n_steps: 100000
  burn_in: 5000
  thin: 5
  chunk_size: 5000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 16

seed: 42
