# Fast end-to-end check of the real-Planck path. NOT a science run -- every budget here
# is too small to converge; the point is to prove that the MontePython wrapper, clik,
# CLASS, the MPI evaluation loop, training, sampling and acquisition all work together
# before committing hours to input/planck2018_lcdm.yaml.
#
# 200 + 200 = 400 evaluations, roughly 100 s across 8 MPI ranks with CLASS++.
#
#   mpirun -n 8 python client.py input/planck2018_lcdm_smoke.yaml -n planck_smoke -i 2
#
# Check afterwards: 27 parameters in metadata.json, two training CSVs with finite
# targets, a falling val_loss, a non-degenerate acceptance rate, and max(tau) reported.

likelihood:
  wrapper: montepython
  input: input/montepython/base2018TTTEEE_lensing_bao.param

prior:
  n_samples: 200
  sampling_strategy: lhs
  n_sigma: 3.0

acquisition:
  n_append: 200
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0
  batch_size: 10

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 150
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250
  lr_schedule: none
  warm_start: true

sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 108
  n_steps: 4000
  burn_in: 500
  thin: 1
  chunk_size: 2000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 2

seed: 42
