# 29D analytic banana, WIDE nuisance priors (18 of 21 widened x5), +/-30 sigma box,
# 2000-point initial LHC and 2000 appended per iteration. Standard c: msre_ess_floor 0.0
# leaves the loss exactly as dev ships it.
#
# The best LHC point falls ~4041 log-units below the true maximum (-25.769) here, against
# ~800 for the 16D wide target and 1053 for the hardest case previously on record. This is
# the deepest hallucination regime tested.
likelihood:
  wrapper: cobaya
  input: input/cobaya/banana_planck_wide.yaml

prior:
  n_samples: 2000
  sampling_strategy: lhs
  n_sigma: 30.0

acquisition:
  n_append: 2000
  pool_factor: 20      # pool = 40000 from the chain, plus a disjoint reference of ~n_train
  n_neighbors: 20
  target_temperature: 7.0

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1   # dynamic c: raised to reach ESS >= 0.1n, floor only
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250

sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 432
  n_steps: 100000      # 29D mixes more slowly than 16D (tau ~1000 there); tau is reported
  thin: 5
  burn_in: 5000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 6    # iterations 0..5, matching the base arm

seed: 42
