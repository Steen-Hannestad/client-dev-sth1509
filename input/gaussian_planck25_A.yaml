# MODEL A for the transfer experiment: the 25D conditional Gaussian, i.e. the shipped 27D
# Planck Gaussian with ln10_10_A_s and n_s FIXED at their means. Generated by
# benchmarking/make_nested_config.py; nesting verified to 2.55e-10 on a scale of 6.79e+02,
# offset +8.0650839 (logpost) recorded in input/cobaya/gaussian_planck25.transfer.json.
#
# Recipe is the current best: dynamic c (msre_ess_floor 0.1) plus per-iteration
# re-injection, which reached 59x the noise floor at 58D where the base arm sat at 326x.
#
# The +/-30 sigma box is clipped by gaussian_planck.yaml's own prior ceilings, which is
# exactly the box every measurement in docs/TRANSFER_DESIGN.md 3b was made on. Model B
# (the 27D parent) must use the same n_sigma or nothing is comparable.
likelihood:
  wrapper: cobaya
  input: input/cobaya/gaussian_planck25.yaml

prior:
  n_samples: 2000
  sampling_strategy: lhs
  n_sigma: 30.0
  n_inject: 0          # re-injection below supersedes the one-shot form

acquisition:
  n_append: 2000
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0
  n_inject: 100        # re-fit the quadratic on everything each iteration

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250

sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 432
  n_steps: 100000      # buffer = 100000 x 216 x 25 x 4 B = 2.2 GiB, cf. 2.7 for the 31D runs
  thin: 5
  burn_in: 5000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 11   # iterations 0..10; every iteration is saved, so it is usable earlier

seed: 42
