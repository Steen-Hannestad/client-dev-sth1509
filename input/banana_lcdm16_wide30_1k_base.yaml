# 16D banana, WIDE nuisance priors (x5), +/-30 sigma, 2000-point LHC and 2000 appended
# per iteration. Runs to convergence or iteration 10, whichever comes first.
likelihood:
  wrapper: cobaya
  input: input/cobaya/banana_lcdm16_wide.yaml

prior:
  n_samples: 1000
  sampling_strategy: lhs
  n_sigma: 30.0

acquisition:
  n_append: 1000
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.0   # dev as it stands: c fixed at 0.5*dchi2(3,16) = 19.2 log-units
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250

sampling:
  sampler: aies
  temperature: 7.0
  n_walkers: 432
  n_steps: 50000      # fixed length, as requested; max(tau) is reported each iteration
  thin: 5
  burn_in: 5000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 11   # iterations 0..10

seed: 42
