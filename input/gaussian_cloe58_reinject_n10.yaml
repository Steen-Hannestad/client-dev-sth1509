# 58D Euclid/CLOE Gaussian: the covariance of cloe-big.covmat, in the form
# input/cobaya/gaussian_planck.yaml uses (Cobaya's built-in gaussian, mean and cov
# inline). Generated by client_public/benchmarking/make_gaussian_config.py.
#
# n_sigma is 4, not the 30 the banana targets use, and that is not conservatism. The
# initial design's shortfall below the true maximum grows as n_sigma^2 * d, and this
# covariance is strongly correlated: a box that is +/-k sigma on every *marginal* reaches
# 47x further in chi^2 than an uncorrelated matrix with the same marginals, because the
# corners run along the tight eigen-directions (9.5 decades of eigenvalue spread).
# Measured best-of-2000 shortfalls:
#
#     n_sigma     2      3      4      5     10      30
#     shortfall 1024   2304   4096   6401  25603  185856
#
# against 4041 for the 29D wide banana and 3383 for the 31D. n_sigma = 4 therefore puts
# this target at the anchor error the dynamic-c work was calibrated on, at twice the
# dimension. Raise it once that works; do not start at 30.
#
# This file is the DYNAMIC-C + INJECTION arm.
#
# ARM 6: the re-injection arm on a WIDER initial design, n_sigma 10 instead of 4.
#
# The best-of-2000 shortfall below the true maximum goes 4096 -> 25603 log-units, a 6.3x
# deeper anchor error, because the shortfall scales as n_sigma^2 and this covariance is
# strongly correlated (a +/-k sigma marginal box reaches 47x further in chi^2 than an
# uncorrelated matrix with the same marginals). For scale: the 29D wide banana sat at
# 4012 and the 31D at 3383, so this is ~6x harder than anything previously run.
#
# The yaml prior is +/-50 sigma so n_sigma=10 is the binding constraint, not the box.
# NOTE the truth changes: the posterior is the Gaussian truncated to THIS box, so it must
# be scored against a reference built from input/gaussian_cloe58_n10.yaml, not the n_std=4
# one. The difference is small (rejection acceptance 0.997 vs ~1.000) but not zero.
#
# ARM 4/5 lineage: dynamic c + injection RE-ESTIMATED EVERY ITERATION.
#
# Identical to gaussian_cloe58_inject.yaml except for acquisition.n_inject: 100, which
# re-fits the quadratic on the WHOLE accumulated training set after each acquisition and
# draws 100 fresh points from the Gaussian it implies. prior.n_inject fits the initial
# design once and never revisits it; this tracks the fit as the data improves.
#
# Cost: 100 evaluations after the LHC plus 100 after each of iterations 0-4 = 600, against
# 100 for arm 3. That is 5% of the 12000-point budget, and the comparison against arm 3 is
# therefore not evaluation-matched -- arm 4 sees 600 more true calls. Worth stating when
# reading any difference between them.
#
# prior.n_inject stays 100 so iteration 0 is byte-identical to arm 3 and the only
# difference between the two arms is the re-injection.
#
# n_inject is 100, matching the 29D and 31D runs so the three targets are directly
# comparable. Note that 100 is BELOW the alpha*n/(1-alpha) = 222 threshold of CHANGES.md
# section 2: the target ESS of 210 exceeds the injected cluster, so no c satisfies it
# within that cluster and the floor must inflate c until the 2000 design points carry
# weight. At 31D that produced c x145, worse than no injection at all -- and that arm
# still scored best, which is why the comparison is worth having at 58D too.
# gaussian_cloe58_inject250.yaml is the above-threshold variant, unrun.
likelihood:
  wrapper: cobaya
  input: input/cobaya/gaussian_cloe58.yaml

prior:
  n_samples: 2000
  sampling_strategy: lhs
  n_sigma: 10.0
  n_inject: 100

acquisition:
  n_append: 2000
  pool_factor: 20
  n_neighbors: 20
  target_temperature: 7.0
  n_inject: 100        # re-drawn every iteration from the full accumulated fit

model:
  n_layers: 5
  n_neurons: 512
  activation: alsing

training:
  n_epochs: 5000
  batch_size: 128
  loss: msre
  sigma_level: 3
  msre_ess_floor: 0.1   # dynamic c: ESS floor at alpha = 0.1
  learning_rate: 0.0001
  validation_split: 0.1
  patience: 250

sampling:
  sampler: aies
  temperature: 7.0
  # 216 was the banana setting (7.4 x ndim at 29D); here it is 3.7 x ndim, still well
  # above the 2 x floor the stretch move needs. AIES acceptance on the TRUE 58D target
  # at T=7 is 0.106, against 0.199 at 29D and 0.137 at 31D -- lower, but workable.
  n_walkers: 432
  # 60000, not the 100000 the 29D/31D runs used, for memory: the chain buffer is
  # (n_steps, n_walkers, ndim) float32, which at 58D is 5.0 GiB at 100000 steps against
  # 2.7 GiB at 31D, on a 16 GiB machine. 60000 restores the 3.0 GiB the 31D runs ran at.
  # It is not a blind cut: max(tau) on the TRUE target at T=7 is 1517, so 60000 steps is
  # 36 tau -- between the 31D reference (21) and the 29D (51).
  n_steps: 60000
  thin: 5
  burn_in: 5000

convergence:
  metric: gaussian_posterior_drift
  threshold: 0.01
  max_iterations: 16   # iterations 0..15. The documented result needs all of them: this
                     # arm is still descending at 10 (drift 23.1, dCM 791x the noise floor)
                     # and only reaches 1.01 / 91x by 15. Matches gaussian_cloe58_base_n10.

seed: 42
